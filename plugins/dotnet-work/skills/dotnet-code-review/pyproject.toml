[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dotnet-review"
version = "1.1.0"
description = "C#/.NET code review CLI — Roslyn-based static analysis with 186+ rules"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "master0071"}]
keywords = ["csharp", "dotnet", "code-review", "roslyn", "static-analysis"]

[project.scripts]
dotnet-review = "review.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["review*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
